<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Your community home for watch parties, games, events, and good company." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://player.vimeo.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=6" onerror="document.documentElement.classList.add('styles-failed')" />
    <style>
      html.styles-failed { color-scheme: dark; --fallback-bg:#080a0d; --fallback-panel:#13191d; --fallback-line:rgba(255,255,255,.12); --fallback-text:#f1f0eb; --fallback-muted:#9ba5a3; --fallback-accent:#ff526c; }
      html.styles-failed body { margin:0; min-height:100vh; background:linear-gradient(135deg,#0b0e11,#080a0d 60%,#11110f); color:var(--fallback-text); font:15px/1.5 Arial,sans-serif; }
      html.styles-failed .page-shell { width:min(1320px,calc(100% - 32px)); margin:auto; padding-bottom:60px; }
      html.styles-failed .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:18px 0; background:#090b0ef2; border-bottom:1px solid var(--fallback-line); }
      html.styles-failed .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.12em; }
      html.styles-failed .brand-mark { width:10px; height:10px; border-radius:50%; background:var(--fallback-accent); box-shadow:0 0 16px var(--fallback-accent); }
      html.styles-failed .nav { display:flex; flex-wrap:wrap; gap:12px; }
      html.styles-failed .nav a { color:var(--fallback-muted); text-decoration:none; text-transform:uppercase; font-size:12px; padding:8px; }
      html.styles-failed .nav a.is-active { color:var(--fallback-text); border-bottom:2px solid var(--fallback-accent); }
      html.styles-failed main { display:block; padding-top:12px; }
      html.styles-failed h1, html.styles-failed h2, html.styles-failed h3 { line-height:1.15; }
      html.styles-failed h1 { font-size:clamp(32px,5vw,58px); }
      html.styles-failed p { color:var(--fallback-muted); }
      html.styles-failed .page-section { margin-top:32px; }
      html.styles-failed .hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:24px; align-items:center; margin-top:32px; }
      html.styles-failed .hero-copy, html.styles-failed .panel, html.styles-failed .room-card, html.styles-failed .status-item, html.styles-failed .rank-row, html.styles-failed .welcome-strip { padding:20px; background:var(--fallback-panel); border:1px solid var(--fallback-line); border-radius:8px; }
      html.styles-failed .grid-3, html.styles-failed .grid-2, html.styles-failed .room-grid, html.styles-failed .status-grid, html.styles-failed .missions-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:16px; }
      html.styles-failed .button, html.styles-failed button { display:inline-block; padding:10px 14px; border:1px solid var(--fallback-line); border-radius:5px; background:transparent; color:var(--fallback-text); cursor:pointer; }
      html.styles-failed .button-primary, html.styles-failed .button.primary { background:var(--fallback-accent); color:#16080b; border-color:var(--fallback-accent); }
      html.styles-failed a { color:inherit; }
      html.styles-failed input, html.styles-failed textarea, html.styles-failed select { max-width:100%; padding:10px; background:#090b0e; color:var(--fallback-text); border:1px solid var(--fallback-line); }
      html.styles-failed .empty-state { padding:20px; border:1px solid var(--fallback-line); color:var(--fallback-muted); }
      @media(max-width:700px) { html.styles-failed .nav { gap:4px; } html.styles-failed .nav a { padding:6px; } }
    </style>
  </head>
  <body class="zenith-app">
    <div class="page-shell">
      <header class="topbar" id="topbar"></header>
      <main id="app" aria-live="polite"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/js/media-providers.js?v=9"></script>
    <script src="/js/app.js?v=10"></script>
  </body>
</html>
